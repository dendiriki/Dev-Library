<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Semantic HTML page layout</title>
<desc id="desc">Use elements that describe the role of each region, rather than generic containers everywhere.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111b2e"/>
    <stop offset="1" stop-color="#0a1020"/>
  </linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a78bfa"/>
    <stop offset="1" stop-color="#7058d8"/>
  </linearGradient>
  <style>
    .title { font: 700 32px Inter, Arial, sans-serif; fill: #f4f6fc; }
    .subtitle { font: 400 17px Inter, Arial, sans-serif; fill: #aebbd0; }
    .label { font: 700 23px Inter, Arial, sans-serif; fill: #f8f9ff; }
    .small { font: 400 16px Inter, Arial, sans-serif; fill: #c0cbe0; }
    .tiny { font: 600 13px Inter, Arial, sans-serif; fill: #aebbd0; }
    .box { fill: #17243a; stroke: #3b4b68; stroke-width: 2; }
    .purple { fill: #29234e; stroke: #a78bfa; stroke-width: 2; }
    .green { fill: #15352f; stroke: #63d7aa; stroke-width: 2; }
    .yellow { fill: #3a3220; stroke: #f4c96b; stroke-width: 2; }
    .line { stroke: #7183a1; stroke-width: 3; fill: none; }
  </style>
</defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/>
<text x="58" y="70" class="title">Semantic HTML page layout</text>
<text x="58" y="105" class="subtitle">Use elements that describe the role of each region, rather than generic containers everywhere.</text>

<rect x="220" y="145" width="760" height="65" rx="12" class="purple"/>
<text x="600" y="185" text-anchor="middle" class="label">&lt;header&gt; · site introduction / logo</text>
<rect x="220" y="225" width="760" height="55" rx="10" class="green"/>
<text x="600" y="261" text-anchor="middle" class="label">&lt;nav&gt; · navigation links</text>
<rect x="220" y="295" width="500" height="150" rx="12" class="yellow"/>
<text x="470" y="335" text-anchor="middle" class="label">&lt;main&gt;</text>
<rect x="255" y="355" width="430" height="65" rx="9" class="box"/>
<text x="470" y="395" text-anchor="middle" class="small">&lt;article&gt; or &lt;section&gt; · main content</text>
<rect x="740" y="295" width="240" height="150" rx="12" class="box"/>
<text x="860" y="350" text-anchor="middle" class="label">&lt;aside&gt;</text>
<text x="860" y="385" text-anchor="middle" class="small">Related content</text>
<rect x="220" y="460" width="760" height="55" rx="10" class="purple"/>
<text x="600" y="496" text-anchor="middle" class="label">&lt;footer&gt; · contact / copyright</text>

</svg>