<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Generic containers vs semantic HTML</title>
<desc id="desc">The visual layout can be similar, but semantic tags communicate each region&#x27;s purpose.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111b2e"/>
    <stop offset="1" stop-color="#0a1020"/>
  </linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a78bfa"/>
    <stop offset="1" stop-color="#7058d8"/>
  </linearGradient>
  <style>
    .title { font: 700 32px Inter, Arial, sans-serif; fill: #f4f6fc; }
    .subtitle { font: 400 17px Inter, Arial, sans-serif; fill: #aebbd0; }
    .label { font: 700 23px Inter, Arial, sans-serif; fill: #f8f9ff; }
    .small { font: 400 16px Inter, Arial, sans-serif; fill: #c0cbe0; }
    .tiny { font: 600 13px Inter, Arial, sans-serif; fill: #aebbd0; }
    .box { fill: #17243a; stroke: #3b4b68; stroke-width: 2; }
    .purple { fill: #29234e; stroke: #a78bfa; stroke-width: 2; }
    .green { fill: #15352f; stroke: #63d7aa; stroke-width: 2; }
    .yellow { fill: #3a3220; stroke: #f4c96b; stroke-width: 2; }
    .line { stroke: #7183a1; stroke-width: 3; fill: none; }
  </style>
</defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/>
<text x="58" y="70" class="title">Generic containers vs semantic HTML</text>
<text x="58" y="105" class="subtitle">The visual layout can be similar, but semantic tags communicate each region&#x27;s purpose.</text>

<rect x="65" y="160" width="490" height="330" rx="18" class="box"/>
<text x="310" y="205" text-anchor="middle" class="label">BEFORE · generic divs</text>
<rect x="115" y="240" width="390" height="48" rx="8" fill="#293650" stroke="#61718e"/>
<text x="310" y="271" text-anchor="middle" class="small">&lt;div class="top"&gt;</text>
<rect x="115" y="300" width="390" height="48" rx="8" fill="#293650" stroke="#61718e"/>
<text x="310" y="331" text-anchor="middle" class="small">&lt;div class="menu"&gt;</text>
<rect x="115" y="360" width="390" height="48" rx="8" fill="#293650" stroke="#61718e"/>
<text x="310" y="391" text-anchor="middle" class="small">&lt;div class="content"&gt;</text>
<rect x="115" y="420" width="390" height="48" rx="8" fill="#293650" stroke="#61718e"/>
<text x="310" y="451" text-anchor="middle" class="small">&lt;div class="bottom"&gt;</text>
<text x="600" y="335" text-anchor="middle" class="label">→</text>
<rect x="645" y="160" width="490" height="330" rx="18" class="box"/>
<text x="890" y="205" text-anchor="middle" class="label">AFTER · semantic HTML</text>
<rect x="695" y="240" width="390" height="48" rx="8" class="purple"/>
<text x="890" y="271" text-anchor="middle" class="small">&lt;header&gt;</text>
<rect x="695" y="300" width="390" height="48" rx="8" class="green"/>
<text x="890" y="331" text-anchor="middle" class="small">&lt;nav&gt;</text>
<rect x="695" y="360" width="390" height="48" rx="8" class="yellow"/>
<text x="890" y="391" text-anchor="middle" class="small">&lt;main&gt;</text>
<rect x="695" y="420" width="390" height="48" rx="8" class="purple"/>
<text x="890" y="451" text-anchor="middle" class="small">&lt;footer&gt;</text>

</svg>