<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">The three layers of a website</title>
<desc id="desc">HTML structures content, CSS styles it, and JavaScript adds behavior.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111b2e"/>
    <stop offset="1" stop-color="#0a1020"/>
  </linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a78bfa"/>
    <stop offset="1" stop-color="#7058d8"/>
  </linearGradient>
  <style>
    .title { font: 700 32px Inter, Arial, sans-serif; fill: #f4f6fc; }
    .subtitle { font: 400 17px Inter, Arial, sans-serif; fill: #aebbd0; }
    .label { font: 700 23px Inter, Arial, sans-serif; fill: #f8f9ff; }
    .small { font: 400 16px Inter, Arial, sans-serif; fill: #c0cbe0; }
    .tiny { font: 600 13px Inter, Arial, sans-serif; fill: #aebbd0; }
    .box { fill: #17243a; stroke: #3b4b68; stroke-width: 2; }
    .purple { fill: #29234e; stroke: #a78bfa; stroke-width: 2; }
    .green { fill: #15352f; stroke: #63d7aa; stroke-width: 2; }
    .yellow { fill: #3a3220; stroke: #f4c96b; stroke-width: 2; }
    .line { stroke: #7183a1; stroke-width: 3; fill: none; }
  </style>
</defs>
<rect width="1200" height="560" rx="24" fill="url(#bg)"/>
<text x="58" y="70" class="title">The three layers of a website</text>
<text x="58" y="105" class="subtitle">HTML structures content, CSS styles it, and JavaScript adds behavior.</text>

<rect x="70" y="170" width="320" height="280" rx="20" class="purple"/>
<text x="230" y="235" text-anchor="middle" class="label">HTML</text>
<text x="230" y="280" text-anchor="middle" class="small">Structure &amp; meaning</text>
<text x="230" y="330" text-anchor="middle" class="small">Headings · paragraphs</text>
<text x="230" y="360" text-anchor="middle" class="small">Links · images · forms</text>
<text x="230" y="410" text-anchor="middle" class="tiny">WHAT is on the page?</text>
<text x="440" y="320" text-anchor="middle" class="label">+</text>
<rect x="490" y="170" width="320" height="280" rx="20" class="green"/>
<text x="650" y="235" text-anchor="middle" class="label">CSS</text>
<text x="650" y="280" text-anchor="middle" class="small">Presentation &amp; design</text>
<text x="650" y="330" text-anchor="middle" class="small">Color · spacing · layout</text>
<text x="650" y="360" text-anchor="middle" class="small">Typography · responsive UI</text>
<text x="650" y="410" text-anchor="middle" class="tiny">HOW does it look?</text>
<text x="860" y="320" text-anchor="middle" class="label">+</text>
<rect x="910" y="170" width="220" height="280" rx="20" class="yellow"/>
<text x="1020" y="235" text-anchor="middle" class="label">JavaScript</text>
<text x="1020" y="280" text-anchor="middle" class="small">Behavior</text>
<text x="1020" y="330" text-anchor="middle" class="small">Events · logic</text>
<text x="1020" y="360" text-anchor="middle" class="small">Dynamic updates</text>
<text x="1020" y="410" text-anchor="middle" class="tiny">HOW does it work?</text>

</svg>